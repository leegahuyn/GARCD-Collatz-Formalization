name: GARCD modular Lean diagnosis

on:
  push:
    branches: [main, 'research/**']
  pull_request:
  workflow_dispatch:

jobs:
  module-diagnosis:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean toolchain (elan)
        shell: bash
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh |
            sh -s -- -y --default-toolchain none --no-modify-path
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version
          "$HOME/.elan/bin/lake" --version
      - name: Resolve pinned Mathlib dependencies and obtain cache
        shell: bash
        run: |
          lake update
          lake exe cache get
      - name: Compile cumulative modules, capturing all failures
        shell: bash
        run: bash Scripts/verify.sh
      - name: Check all declared modules and import aggregation
        if: ${{ success() }}
        run: lake build GARCD
      - name: Axiom audit only after all modules build
        if: ${{ success() }}
        run: bash Scripts/axiom-audit.sh
      - name: Upload raw module logs (including failures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GARCD-module-compile-logs
          path: Diagnostics/
          if-no-files-found: warn
