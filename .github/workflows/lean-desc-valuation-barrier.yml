name: GARCD finite-time valuation barrier / exact DESC
on:
  push:
    branches: ['research/desc-valuation-barrier-2026-11-11']
    paths:
      - 'GARCD/DESCValuationBarrier.lean'
      - 'GARCD.lean'
      - '.github/workflows/lean-desc-valuation-barrier.yml'
  workflow_dispatch:
jobs:
  descent-barrier:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean via pinned elan
        shell: bash
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh |
            sh -s -- -y --default-toolchain none --no-modify-path
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Restore pinned mathlib
        shell: bash
        run: |
          lake update
          lake exe cache get
      - name: Kernel check finite-time valuation barrier
        shell: bash
        run: |
          set -o pipefail
          mkdir -p Diagnostics/desc-barrier
          git rev-parse HEAD | tee Diagnostics/desc-barrier/commit.txt
          lake build GARCD.DESCValuationBarrier 2>&1 | tee Diagnostics/desc-barrier/build.log
      - name: Transitive proof axiom audit
        shell: bash
        run: |
          set -o pipefail
          lake env lean GARCD/DESCValuationBarrier.lean 2>&1 | tee Diagnostics/desc-barrier/axioms.log
          if grep -E 'sorryAx|unsound|_native\\.native_decide\\.ax_' Diagnostics/desc-barrier/axioms.log; then
            echo 'Unexpected unsafe proof dependency'
            exit 1
          fi
      - name: Complete root build
        shell: bash
        run: |
          set -o pipefail
          lake build GARCD 2>&1 | tee Diagnostics/desc-barrier/root.log
      - name: Preserve logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GARCD-desc-valuation-barrier-logs
          path: Diagnostics/desc-barrier/
          if-no-files-found: warn
