name: GARCD uniform seven-fourths valuation obstruction
on:
  push:
    branches: ['research/desc-uniform-drift-7over4-2026-11-11']
    paths:
      - 'GARCD/DESCUniformSevenFourths.lean'
      - 'GARCD.lean'
      - '.github/workflows/lean-desc-uniform-seven-fourths.yml'
  workflow_dispatch:
jobs:
  verify-uniform-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        shell: bash
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh |
            sh -s -- -y --default-toolchain none --no-modify-path
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Restore pinned Mathlib
        shell: bash
        run: |
          lake update
          lake exe cache get
      - name: Kernel verification
        shell: bash
        run: |
          set -o pipefail
          mkdir -p Diagnostics/desc-seven-fourths
          lake build GARCD.DESCUniformSevenFourths 2>&1 | tee Diagnostics/desc-seven-fourths/build.log
      - name: Axiom audit
        shell: bash
        run: |
          set -o pipefail
          lake env lean GARCD/DESCUniformSevenFourths.lean 2>&1 | tee Diagnostics/desc-seven-fourths/axioms.log
          if grep -E 'sorryAx|unsound|_native\\.native_decide\\.ax_' Diagnostics/desc-seven-fourths/axioms.log; then
            exit 1
          fi
      - name: Root build
        shell: bash
        run: |
          set -o pipefail
          lake build GARCD 2>&1 | tee Diagnostics/desc-seven-fourths/root.log
      - name: Preserve logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GARCD-desc-seven-fourths-logs
          path: Diagnostics/desc-seven-fourths/
          if-no-files-found: warn
