name: GARCD Mersenne arbitrary exceptional prefixes
on:
  push:
    branches: ['research/desc-mersenne-arbitrary-prefix-2026-11-11']
    paths:
      - 'GARCD/DESCMersenneBadPrefixes.lean'
      - 'GARCD.lean'
      - '.github/workflows/lean-desc-mersenne-bad-prefix.yml'
  workflow_dispatch:
jobs:
  mersenne-prefix:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        shell: bash
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh |
            sh -s -- -y --default-toolchain none --no-modify-path
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Restore pinned mathlib
        shell: bash
        run: |
          lake update
          lake exe cache get
      - name: Kernel-check arbitrarily long bad prefixes
        shell: bash
        run: |
          set -o pipefail
          mkdir -p Diagnostics/desc-mersenne-prefix
          git rev-parse HEAD | tee Diagnostics/desc-mersenne-prefix/commit.txt
          lake build GARCD.DESCMersenneBadPrefixes 2>&1 | tee Diagnostics/desc-mersenne-prefix/module.log
      - name: Audit transitive axioms
        shell: bash
        run: |
          set -o pipefail
          lake env lean GARCD/DESCMersenneBadPrefixes.lean 2>&1 | tee Diagnostics/desc-mersenne-prefix/axioms.log
          if grep -E 'sorryAx|unsound|_native\\.native_decide\\.ax_' Diagnostics/desc-mersenne-prefix/axioms.log; then
            echo 'Unsafe dependence detected'
            exit 1
          fi
      - name: Full GARCD build
        shell: bash
        run: |
          set -o pipefail
          lake build GARCD 2>&1 | tee Diagnostics/desc-mersenne-prefix/root.log
      - name: Preserve diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GARCD-mersenne-prefix-logs
          path: Diagnostics/desc-mersenne-prefix/
          if-no-files-found: warn
