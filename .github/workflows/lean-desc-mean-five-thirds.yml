name: GARCD stronger five-thirds drift and single-halving density
on:
  push:
    branches: ['research/desc-mean-5over3-2026-11-11']
    paths:
      - 'GARCD/DESCMeanFiveThirds.lean'
      - 'GARCD.lean'
      - '.github/workflows/lean-desc-mean-five-thirds.yml'
  workflow_dispatch:
jobs:
  mean-five-thirds:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        shell: bash
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh |
            sh -s -- -y --default-toolchain none --no-modify-path
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Restore pinned Mathlib
        shell: bash
        run: |
          lake update
          lake exe cache get
      - name: Build new drift and one-count theorems
        shell: bash
        run: |
          set -o pipefail
          mkdir -p Diagnostics/desc-five-thirds
          git rev-parse HEAD | tee Diagnostics/desc-five-thirds/commit.txt
          lake build GARCD.DESCMeanFiveThirds 2>&1 | tee Diagnostics/desc-five-thirds/module.log
      - name: Axiom audit
        shell: bash
        run: |
          set -o pipefail
          lake env lean GARCD/DESCMeanFiveThirds.lean 2>&1 | tee Diagnostics/desc-five-thirds/axioms.log
          if grep -E 'sorryAx|unsound|_native\\.native_decide\\.ax_' Diagnostics/desc-five-thirds/axioms.log; then
            echo 'Unexpected unsafe proof dependency'
            exit 1
          fi
      - name: GARCD root build
        shell: bash
        run: |
          set -o pipefail
          lake build GARCD 2>&1 | tee Diagnostics/desc-five-thirds/root.log
      - name: Preserve full verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GARCD-five-thirds-logs
          path: Diagnostics/desc-five-thirds/
          if-no-files-found: warn
