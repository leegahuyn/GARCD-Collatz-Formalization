name: GARCD infinite subfamilies of final 13 residue classes
on:
  push:
    branches: ['research/desc-infinite13-2026-11-10']
    paths:
      - 'GARCD/DESCInfiniteFamilies.lean'
      - 'GARCD.lean'
      - '.github/workflows/lean-desc-infinite13.yml'
  workflow_dispatch:
jobs:
  prove-infinite-desc:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        shell: bash
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh |
            sh -s -- -y --default-toolchain none --no-modify-path
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Restore pinned Mathlib
        shell: bash
        run: |
          lake update
          lake exe cache get
      - name: Kernel-check all thirteen infinite subfamilies
        shell: bash
        run: |
          set -o pipefail
          mkdir -p Diagnostics/desc-infinite13
          git rev-parse HEAD | tee Diagnostics/desc-infinite13/commit.txt
          lake build GARCD.DESCInfiniteFamilies 2>&1 | tee Diagnostics/desc-infinite13/module.log
      - name: Transitive axiom audit
        shell: bash
        run: |
          set -o pipefail
          lake env lean GARCD/DESCInfiniteFamilies.lean 2>&1 | tee Diagnostics/desc-infinite13/axioms.log
          if grep -E 'sorryAx|unsound|_native\\.native_decide\\.ax_' Diagnostics/desc-infinite13/axioms.log; then
            echo 'Unsafe proof dependency'
            exit 1
          fi
      - name: Build complete root
        shell: bash
        run: |
          set -o pipefail
          lake build GARCD 2>&1 | tee Diagnostics/desc-infinite13/root.log
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GARCD-desc-infinite13-logs
          path: Diagnostics/desc-infinite13/
          if-no-files-found: warn
